<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CthulhuSheets</title>
  <script>
    // Redirect to index.html with the path encoded as a query param so the
    // SPA router can restore it after Blazor loads.
    // pathSegmentsToKeep = 1 because this is a project page (/CthulhuSheets/).
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
